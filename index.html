<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BijliSmart</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5d3b">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f8f4;--card:#fff;--tx:#14231a;--mu:#5a6b60;--bd:#d8e0d6;--g:#0b5d3b;--l:#a6e22e;--er:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1612;--card:#17221c;--tx:#e8f0ea;--mu:#9fb0a5;--bd:#2c3b32;--g:#5fd08f;--l:#a6e22e;--er:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Noto Sans Gujarati","Noto Sans Devanagari","Shruti","Nirmala UI",sans-serif;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:#0b5d3b;color:#fff}
header h1{margin:0;font-size:1.2rem}header small{display:block;opacity:.85}
select,input,button{font:inherit}
select,input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
header select{width:auto}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:1.2rem}h3{margin:12px 0 6px;font-size:1rem}
label{display:block;margin:10px 0 4px;font-weight:600}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;margin:12px 8px 0 0}
.btn.alt{background:transparent;color:var(--g);border:1px solid var(--g)}
@media (prefers-color-scheme:dark){.btn{color:#0e1612}}
.err{color:var(--er);font-size:.9rem;min-height:1em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{border:1px solid var(--bd);border-radius:12px;padding:10px;border-left:4px solid var(--l)}
.m b{display:block;font-size:1.15rem}.m span{color:var(--mu);font-size:.85rem}
.mu{color:var(--mu);font-size:.9rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;padding:12px 4px;background:none;border:0;color:var(--mu);cursor:pointer}
nav button.on{color:var(--g);font-weight:700;border-top:3px solid var(--l)}
.v{display:none}.v.on{display:block}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--l);outline-offset:2px}
@media print{header select,nav,.noprint{display:none!important}body{background:#fff;color:#000}}
input,select,.btn,nav button{min-height:44px}
input[aria-invalid=true]{border-color:var(--er);border-width:2px}
.err{display:block;margin:4px 0 0}
.po{display:none}
.wn{border-left:4px solid #d4a017;padding:8px 10px;background:rgba(212,160,23,.14);border-radius:8px}
nav{justify-content:center}nav button{max-width:200px}
@media (max-width:359px){.grid{grid-template-columns:1fr}}
@media (min-width:900px){main{max-width:980px}#v-an.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}#v-home .card,#v-set .card{max-width:640px}}
@media print{.po{display:block}header small{display:none}.card{break-inside:avoid;border-color:#999}}
details{margin:12px 0}summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.bd{font-size:.7rem;font-style:normal;border:1px solid var(--bd);border-radius:20px;padding:0 6px;margin-left:6px;white-space:nowrap}
.bar{height:14px;background:var(--bd);border-radius:8px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--g)}
@media (prefers-color-scheme:dark){.bar i{background:var(--l)}}
.as li{margin:2px 0}
@media (min-width:900px){#v-solar.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}}
textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto;min-height:0;transform:scale(1.4);margin:8px}
.ck{display:flex;align-items:center;gap:8px}.ck label{margin:0}
.qrow{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.qt{width:100%;border-collapse:collapse}.qt th,.qt td{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}.qt .n{text-align:right;white-space:nowrap}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}.sig div{border-top:1px solid var(--tx);padding-top:4px;font-size:.85rem}
nav button{font-size:.8rem;padding:6px 2px}
@media (min-width:900px){#v-quote.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}}
@media print{body[data-v=quote] header{display:none}#v-quote.on{display:block}}
#v-home .cats .btn{display:block;width:100%;margin:8px 0 0;text-align:left}
.gs .btn{display:block;width:100%;margin:8px 0 0;text-align:left}
@media (min-width:900px){#v-guide.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}#v-guide .card{max-width:none}}
</style>
</head>
<body>
<header>
  <div><h1>⚡ BijliSmart</h1><small data-i="tag"></small></div>
  <select id="lang" aria-label="Language / ભાષા / भाषा"><option value="gu">ગુજરાતી</option><option value="hi">हिन्दी</option><option value="en">English</option></select>
</header>
<main>
<section id="v-home" class="v on">
  <div class="card"><h2 data-i="w_t"></h2><p data-i="w_p"></p>
  <button class="btn" data-go="an" data-i="start"></button></div>
  <div class="card cats"><h2 data-i="hm_h"></h2>
  <button class="btn alt" data-gc="res" data-i="hm_res"></button>
  <button class="btn alt" data-gc="com" data-i="hm_com"></button>
  <button class="btn alt" data-gc="ind" data-i="hm_ind"></button></div>
  <div class="card mu" data-i="disc"></div>
</section>

<section id="v-an" class="v">
  <form class="card noprint" id="formcard" novalidate>
    <h2 data-i="nav_an"></h2>
    <p class="mu" data-i="pv_s"></p>
    <p class="err" id="sum" role="alert"></p>
    <div id="fmain"></div>
    <label for="cat" data-i="f_cat"></label>
    <select id="cat"><option value="res" data-i="c_res"></option><option value="com" data-i="c_com"></option><option value="ind" data-i="c_ind"></option></select>
    <label for="dc" data-i="f_dc"></label>
    <select id="dc"><option>UGVCL</option><option>MGVCL</option><option>DGVCL</option><option>PGVCL</option><option>Torrent Power</option><option value="o" data-i="other"></option></select>
    <h3 data-i="p_h"></h3><p class="mu" data-i="p_n"></p>
    <div id="fprev"></div>
    <button class="btn" type="submit" data-i="calc"></button>
    <button class="btn alt" type="button" id="reset" data-i="reset"></button>
    <button class="btn alt" type="button" data-hv data-i="h_view"></button>
  </form>
  <div id="res" aria-live="polite"></div>
</section>

<section id="v-hist" class="v">
  <div class="card"><button class="btn alt noprint" type="button" id="h_back" data-i="h_back"></button>
    <h2 data-i="h_h"></h2><p class="mu" data-i="h_priv"></p><div id="hbody"></div><div id="cbox" class="noprint" hidden></div></div>
</section>

<section id="v-guide" class="v">
  <div class="card"><button class="btn alt noprint" type="button" id="g_back" data-i="g_back"></button>
    <h2 id="gh" tabindex="-1"></h2><p class="mu" id="gp"></p><div class="gs" id="gsteps"></div></div>
  <div>
  <form class="card" id="gform" novalidate>
    <h3 data-i="g_tool_h"></h3><p class="err" id="gsum" role="alert"></p>
    <div id="gbody"></div>
    <button class="btn" type="submit" data-i="g_calc"></button>
  </form>
  <div id="gres" aria-live="polite"></div></div>
</section>

<section id="v-solar" class="v">
  <form class="card noprint" id="sform" novalidate>
    <h2 data-i="s_h"></h2><p class="mu" data-i="s_p"></p><p class="mu" data-i="pv_s"></p>
    <p class="err" id="ssum" role="alert"></p>
    <div id="sbody"></div>
    <button class="btn" type="submit" data-i="sb_calc"></button>
    <button class="btn alt" type="button" id="s_reset" data-i="reset"></button>
  </form>
  <div id="sres" aria-live="polite"></div>
</section>

<section id="v-quote" class="v">
  <form class="card noprint" id="qform" novalidate>
    <h2 data-i="q_h"></h2><p class="mu" data-i="q_p"></p><p class="mu" data-i="q_priv"></p>
    <p class="err" id="qsum" role="alert"></p>
    <div id="qbody"></div>
    <button class="btn" type="submit" data-i="q_gen"></button>
    <button class="btn alt" type="button" id="q_reset" data-i="reset"></button>
  </form>
  <div id="qres" aria-live="polite"></div>
</section>

<section id="v-set" class="v"><div class="card"><h2 data-i="nav_set"></h2>
  <h3 data-i="pv_h"></h3><p data-i="pv_p"></p>
  <h3 data-i="hp_h"></h3><p data-i="hp_p"></p>
  <button class="btn alt" id="clear" data-i="clear"></button></div></section>
</main>
<nav aria-label="Main">
  <button data-go="home" data-i="nav_home"></button><button data-go="an" data-i="nav_an"></button>
  <button data-go="solar" data-i="nav_solar"></button><button data-go="quote" data-i="nav_q"></button><button data-go="set" data-i="nav_set"></button>
</nav>

/* ===== CALCULATION (pure functions, no page code) ===== */
// CALC-START
const LIM={bill:1e8,units:1e7}; // max ₹10 crore bill, 1 crore kWh
function norm(s){ // accepts Gujarati/Hindi digits and commas, returns plain text
  return String(s==null?"":s).replace(/[\u0966-\u096F]/g,c=>c.charCodeAt(0)-0x0966)
    .replace(/[\u0AE6-\u0AEF]/g,c=>c.charCodeAt(0)-0x0AE6).replace(/,/g,"").trim();
}
function num(raw,max,isDays){
  const s=norm(raw);
  if(s==="")return{e:"e_req"};
  if(/^[-\u2212]\s*\d/.test(s))return{e:"e_neg"};
  if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return{e:"e_nan"};
  const v=Number(s);
  if(isDays)return(Number.isInteger(v)&&v>=1&&v<=366)?{v}:{e:"e_days"};
  if(v<=0)return{e:"e_zero"};
  if(v>max)return{e:"e_big"};
  return{v};
}
function pct(now,prev){return (now-prev)/prev*100}
function analyze(i){
  const errs={},val={};
  const chk=(k,max,d)=>{const r=num(i[k],max,d);if(r.e)errs[k]=r.e;else val[k]=r.v};
  chk("bill",LIM.bill);chk("units",LIM.units);chk("days",0,true);
  const P=["pbill","punits","pdays"],any=P.some(k=>norm(i[k])!=="");
  if(any)P.forEach(k=>{if(norm(i[k])==="")errs[k]="e_prev";else chk(k,k==="pbill"?LIM.bill:LIM.units,k==="pdays")});
  if(Object.keys(errs).length)return{errs};
  const{bill,units,days}=val;
  const r={bill,units,days,cpu:bill/units,du:units/days,dc:bill/days,m30:units/days*30};
  r.warn=r.cpu<1||r.cpu>25;
  if(any){const pu30=val.punits/val.pdays*30,pb30=val.pbill/val.pdays*30;
    r.cmp={pu30,pb30,du:pct(r.m30,pu30),db:pct(r.dc*30,pb30)}}
  return r;
}
// CALC-END

const $=id=>document.getElementById(id);

const t=k=>T[lang][k]||k;
const f2=v=>v.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function fld(id,k,mode,val){return `<label for="${id}" data-i="${k}"></label><input id="${id}" type="text" inputmode="${mode}" autocomplete="off" value="${val||""}" aria-describedby="e-${id}"><span class="err" id="e-${id}"></span>`}
$("fmain").innerHTML=fld("bill","f_bill","decimal")+fld("units","f_units","decimal")+fld("days","f_days","numeric",30);
$("fprev").innerHTML=fld("pbill","f_pbill","decimal")+fld("punits","f_punits","decimal")+fld("pdays","f_pdays","numeric");

function showErrs(e){
  curErrs=e||{};
  F.forEach(k=>{const m=curErrs[k];$("e-"+k).textContent=m?t(m):"";
    if(m)$(k).setAttribute("aria-invalid","true");else $(k).removeAttribute("aria-invalid")});
  $("sum").textContent=Object.keys(curErrs).length?t("e_sum"):"";
}
function applyLang(){
  document.documentElement.lang=lang;$("lang").value=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  showErrs(curErrs);render();sLang();qLang();gLang();hRender();cRender();
}
function show(v){document.body.dataset.v=v;if(v==="quote"&&typeof qEnter==="function")qEnter();
  document.querySelectorAll(".v").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>{const on=b.dataset.go===v;b.classList.toggle("on",on);
    if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  window.scrollTo(0,0);
}
function run(){
  const i={};F.forEach(k=>i[k]=$(k).value);
  const r=analyze(i);
  if(r.errs){last=null;showErrs(r.errs);render();$(F.find(k=>r.errs[k])).focus();return}
  showErrs({});r.cat=$("cat").value;r.disc=$("dc").value;last=r;render();$("rh").focus();
}
function chg(p){const a=Math.abs(p);return a<0.005?t("same"):f2(a)+"% "+(p>0?t("up"):t("dn"))}
function render(){
  const box=$("res");
  if(!last){box.innerHTML="";return}
  const r=last;
  const m=(l,v)=>`<div class="m"><span>${l}</span><b>${v}</b></div>`;
  const dcTxt=r.disc==="o"?t("other"):r.disc;
  const date=new Date().toLocaleDateString({gu:"gu-IN",hi:"hi-IN",en:"en-IN"}[lang]);
  let h=`<div class="card"><h2 id="rh" tabindex="-1">${t("r_h")}</h2>`+
   `<p class="po"><b>${t("pr_h")}</b> — ${t("pr_d")}: ${date}</p>`+
   `<p class="mu">${t("f_cat")}: ${t("c_"+r.cat)} • ${t("f_dc")}: ${dcTxt}</p><div class="grid">`+
   m(t("r_bill"),"₹"+f2(r.bill))+m(t("r_units"),f2(r.units)+" kWh")+m(t("r_cpu"),"₹"+f2(r.cpu))+

function snum(raw,o){
  const s=norm(raw);

  if(/^[-\u2212]\s*\d/.test(s))return{e:"e_neg"};
  if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return{e:"e_nan"};
  const v=Number(s);
  if(v===0&&!o.zero)return{e:"e_zero"};
  if(v<(o.min||0)||v>o.max)return{e:"e_rng"};
  return{v};
}
function solarCalc(i){
  const spec={bill:{req:1,max:1e8},units:{max:1e7},area:{max:1e7},size:{max:1e4},cost:{min:1000,max:5e5},sub:{zero:1,max:1e9},maint:{zero:1,max:1e8},esc:{zero:1,max:15},rate:{max:100},export:{zero:1,max:100},avg:{min:0.5,max:100},psh:{min:2,max:7},loss:{zero:1,max:60},deg:{zero:1,max:5},use:{min:10,max:100},apk:{min:5,max:30}};
  const errs={},v={};
  for(const k in spec){const r=snum(i[k],spec[k]);if(r.e)errs[k]=r.e;else v[k]=r.v}
  if(Object.keys(errs).length)return{errs};
  const A={cost:v.cost??SDF.cost,esc:v.esc??SDF.esc,avg:v.avg??SDF.avg,psh:v.psh??SDF.psh,loss:v.loss??SDF.loss,deg:v.deg??SDF.deg,use:v.use??SDF.use,apk:v.apk??SDF.apk};
  const bill=v.bill,unitsEst=v.units===null,units=unitsEst?bill/A.avg:v.units;
  const cons=units*12,share=SDF.share[i.day]??0.5;
  const dayKw=A.psh*(1-A.loss/100),yrKw=dayKw*365;
  const areaSqm=v.area===null?null:v.area*(i.au==="sqm"?1:SDF.sqft);
  const roofKw=areaSqm===null?null:areaSqm*A.use/100/A.apk;
  const target=(i.cat==="res"?cons:cons*share)/yrKw;
  const sug=Math.floor((roofKw===null?target:Math.min(target,roofKw))*2)/2;
  const sizeUser=v.size!==null,size=sizeUser?v.size:sug;
  if(!(size>0))return{errs:{size:"e_nosz"}};
  const gen1=size*yrKw,dayCons=cons*share,cost=size*A.cost,sub=v.sub??0;
  if(sub>cost)return{errs:{sub:"e_sub"}};
  const net=cost-sub,maint=v.maint??cost*0.01,avoid=v.rate??bill/units*SDF.avoid,exp=v.export??0;
  let cum=-net,sav1=0,self1=0,ex1=0,capped=false;

}

function quoteCalc(items,gstRaw,subRaw){
  const errs={},rows=[];

    const d=String(it.d==null?"":it.d).trim(),q=snum(it.q,{req:1,max:1e6}),r=snum(it.r,{req:1,zero:1,max:1e8}),e={};

    if(q.e)e.q=q.e;if(r.e)e.r=r.e;

  });
  const g=snum(gstRaw,{zero:1,max:100}),s=snum(subRaw,{zero:1,max:1e10});
  if(g.e)errs.gst=g.e;if(s.e)errs.sub=s.e;

  if(Object.keys(errs).length)return{errs};
  const subtotal=qround(rows.reduce((a,x)=>a+x.amt,0)),gp=g.v??0,gst=qround(subtotal*gp/100),total=qround(subtotal+gst),sb=s.v??0;
  if(sb>total)return{errs:{sub:"e_sub"}};
  return{rows,subtotal,gp,gst,total,sub:sb,net:qround(total-sb)};
}

/* ===== CATEGORY GUIDE: pure calculation ===== */
// GCALC-START
const SUN=[8,17]; // assumed solar-productive hours (assumption, not official data)
function guideCalc(i){
  const errs={},v={};
  const hr=(k,lo,hi)=>{const s=norm(i[k]);if(s==="")return void(errs[k]="e_req");if(!/^\d+$/.test(s)||Number(s)<lo||Number(s)>hi)return void(errs[k]="e_hr2");v[k]=Number(s)};
  hr("start",0,23);hr("end",1,24);
  if(!errs.start&&!errs.end&&v.start===v.end)errs.end="e_hrs";
  if(i.cat==="ind"){
    const u=snum(i.units,{req:1,max:1e7}),k=snum(i.kva,{req:1,max:1e5}),p=snum(i.pf,{req:1,min:0.5,max:1});
    if(u.e)errs.units=u.e;else v.units=u.v;
    if(k.e)errs.kva=k.e;else v.kva=k.v;
    if(p.e)errs.pf=p.e==="e_rng"?"e_pf":p.e;else v.pf=p.v;
  }
  if(Object.keys(errs).length)return{errs};
  const hours=v.end>v.start?v.end-v.start:24-v.start+v.end;
  const segs=v.end>v.start?[[v.start,v.end]]:[[v.start,24],[0,v.end]];
  const ov=segs.reduce((a,s)=>a+Math.max(0,Math.min(s[1],SUN[1])-Math.max(s[0],SUN[0])),0);
  const share=ov/hours,r={hours,share,level:share<0.35?"low":share<0.65?"med":"high"};
  if(i.cat==="ind"){r.units=v.units;r.lf=v.units/(v.kva*v.pf*720)*100;r.upk=v.units/v.kva;r.lfBad=r.lf>100}
  return r;
}
// GCALC-END

const HK="bs_hist";
function hLoad(){

    return a.filter(x=>x&&[x.id,x.t,x.bill,x.units,x.days].every(Number.isFinite)&&x.bill>0&&x.units>0&&x.days>=1&&x.days<=366&&["res","com","ind"].includes(x.cat))
      .map(x=>({id:x.id,t:x.t,bill:x.bill,units:x.units,days:x.days,cat:x.cat,disc:typeof x.disc==="string"?x.disc.slice(0,20):""})).slice(-24);
  }catch(e){return[]}
}
function hStore(l){try{localStorage.setItem(HK,JSON.stringify(l.slice(-24)));return true}catch(e){return false}}

       m(t("cmp_b"),`₹${f2(n30(b,"bill"))} → ₹${f2(n30(a,"bill"))}<br>${chg(pct(n30(a,"bill"),n30(b,"bill")))}`)+`</div>`;
  }else h+=`<p class="mu">${t("h_one")}</p>`;

  h+=`<h3>${t("h_h")}</h3>`+list.slice().reverse().map(x=>`<div class="qrow"><b>${fd(x.t)}</b> • ₹${f2(x.bill)} • ${f2(x.units)} kWh • ${x.days} • ₹${f2(x.bill/x.units)} • ${t("c_"+x.cat)}${x.disc?" • "+esc(x.disc==="o"?t("other"):x.disc):""}<br>`+

/* ===== CLOUD ACCOUNT (optional) =====
   Off by default. To turn it on, paste your Supabase Project URL and the anon PUBLIC key below.
   NEVER paste the service_role key anywhere in this file. */
const CLOUD=window.BS_CLOUD||{url:"",key:""};
const AK="bs_auth";
const cOn=()=>!!(CLOUD.url&&CLOUD.key);
function cSess(){try{const s=JSON.parse(localStorage.getItem(AK)||"null");return s&&s.access_token&&s.refresh_token&&Number.isFinite(s.exp)?s:null}catch(e){return null}}
function cStore(j){try{if(!j){localStorage.removeItem(AK);return}localStorage.setItem(AK,JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||""}))}catch(e){}}
async function cRaw(path,opt){
  try{return await fetch(CLOUD.url.replace(/\/$/,"")+path,{...opt,headers:{apikey:CLOUD.key,"Content-Type":"application/json",...(opt&&opt.headers)}})}
  catch(e){throw{net:1}}
}
async function cToken(){
  const s=cSess();if(!s)return null;
  if(Date.now()/1000<s.exp-30)return s.access_token;
  const r=await cRaw("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!r.ok){cStore(null);return null}
  const j=await r.json();j.user=j.user||{email:s.email};cStore(j);return j.access_token;
}
async function cAuthed(path,opt){
  const tk=await cToken();if(!tk)throw{auth:1};
  return cRaw(path,{...opt,headers:{Authorization:"Bearer "+tk,...(opt&&opt.headers)}});
}
async function cAuth(mode,email,pass){
  const r=await cRaw(mode==="signup"?"/auth/v1/signup":"/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password:pass})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)return{err:mode==="login"&&(r.status===400||r.status===401)?"c_bad":"c_err"};
  if(j.access_token){cStore(j);return{ok:1}}
  return{ok:1,confirm:1};
}
const cList=async()=>{const r=await cAuthed("/rest/v1/bills?select=id,created_at,bill,units,days,category,disc&order=created_at.desc&limit=24");if(!r.ok)throw{};return r.json()};
const cAdd=async x=>{const r=await cAuthed("/rest/v1/bills",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({bill:x.bill,units:x.units,days:x.days,category:x.cat,disc:x.disc||null})});if(!r.ok)throw{}};
const cDel=async id=>{const r=await cAuthed("/rest/v1/bills?id=eq."+encodeURIComponent(id),{method:"DELETE"});if(!r.ok)throw{}};
const cDelAll=async()=>{const r=await cAuthed("/rest/v1/bills?id=not.is.null",{method:"DELETE"});if(!r.ok)throw{}};

const cErr=x=>x&&x.net?"c_net":"c_err";
async function cRefresh(){if(!cOn()||!cSess()){cBills=[];return}try{cBills=await cList()}catch(e){cBills=[];cMsg=e&&e.auth?"":cErr(e)}}

  const box=$("cbox");if(!cOn()){box.hidden=true;return}

  else h+=`<p>${t("c_as")}: <b>${esc(s.email)}</b></p><button class="btn alt" type="button" id="c_logout">${t("c_logout")}</button><h3>${t("c_list")}</h3>`+
    (cBills.length?cBills.map(x=>`<div class="qrow"><b>${new Date(x.created_at).toLocaleDateString(loc)}</b> • ₹${f2(Number(x.bill))} • ${f2(Number(x.units))} kWh • ${Number(x.days)} • ${["res","com","ind"].includes(x.category)?t("c_"+x.category):""}${x.disc?" • "+esc(x.disc==="o"?t("other"):x.disc):""}<br><button class="btn alt" type="button" data-cu="${esc(x.id)}">${t("h_use")}</button><button class="btn alt" type="button" data-cd="${esc(x.id)}">${t("h_del")}</button></div>`).join("")+`<button class="btn alt" type="button" id="c_delall">${t("c_delall")}</button>`:`<p class="mu">${t("c_empty")}</p>`);
  h+=`<p class="mu" id="c_msg" role="alert">${cMsg?t(cMsg):""}</p>`;
  box.innerHTML=h;
  if($("c_email")){$("c_email").value=keep.e;$("c_pass").value=keep.p;$("c_cons").checked=keep.c}

  if(!cOn())return;
  const b=e.target.closest("#c_login,#c_signup,#c_logout,#c_delall,#c_sv,[data-cd],[data-cu]");if(!b)return;

      cRender();return;

  }
});
document.addEventListener("click",e=>{if(e.target.closest("[data-hv]")&&cOn()){cRender();cRefresh().then(cRender)}});

show("home");applyLang();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
